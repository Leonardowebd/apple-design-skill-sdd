<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta - exemplo Apple Design SDD</title>
<style>
  :root {
    --accent:#007AFF; --label:rgba(0,0,0,.85); --label-2:rgba(60,60,67,.6);
    --sep:rgba(0,0,0,.08); --bg:#F2F2F7; --surface:#FFFFFF; --glass:rgba(255,255,255,.6);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#0A84FF; --label:rgba(255,255,255,.9); --label-2:rgba(235,235,245,.6);
      --sep:rgba(255,255,255,.12); --bg:#000; --surface:#1C1C1E; --glass:rgba(30,30,30,.6);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--label)}
  .screen{width:380px;padding-bottom:24px}
  .bar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:16px 18px;
    background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--sep)}
  .back{color:var(--accent);font-size:24px;line-height:1}
  .bar h1{font-size:18px;font-weight:600;margin:0}
  .profile{display:flex;align-items:center;gap:14px;background:var(--surface);margin:16px;padding:16px;border-radius:18px}
  .avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .name{font-size:17px;margin:0}
  .mail{font-size:14px;color:var(--label-2);margin:2px 0 0}
  .group{background:var(--surface);margin:0 16px;border-radius:18px;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    min-height:44px;font-size:16px;border-bottom:.5px solid var(--sep)}
  .row:last-child{border-bottom:none}
  .chev{color:var(--label-2);opacity:.5;font-size:18px}
  .btn{display:block;width:calc(100% - 32px);margin:20px 16px 0;background:var(--accent);
    color:#fff;border:none;padding:15px;border-radius:14px;font-size:16px;font-weight:500;
    font-family:inherit;cursor:pointer;transition:opacity .2s ease-out}
  .btn:active{opacity:.7}
  @media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
  <main class="screen">
    <div class="bar"><span class="back">&#8249;</span><h1>Conta</h1></div>
    <div class="profile">
      <div class="avatar">LA</div>
      <div><p class="name">Leonardo Aragão</p><p class="mail">leonardo@exemplo.com</p></div>
    </div>
    <div class="group">
      <div class="row"><span>Notificações</span><span class="chev">&#8250;</span></div>
      <div class="row"><span>Privacidade</span><span class="chev">&#8250;</span></div>
      <div class="row"><span>Aparência</span><span class="chev">&#8250;</span></div>
    </div>
    <button class="btn">Salvar alterações</button>
  </main>
</body>
</html>
